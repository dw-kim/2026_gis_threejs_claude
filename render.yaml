# Render Blueprint — Render 대시보드에서 "New +" → "Blueprint"로 이 리포지토리를
# 연결하면 아래 설정을 그대로 읽어 서비스를 만들어준다. Docker 없이 Node 런타임을
# 그대로 써서 package.json의 dependencies(express)만 설치하고 server.js를 실행한다.
services:
  - type: web
    name: 2026-gis-threejs-claude
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: SEOUL_BUS_API_KEY
        sync: false
