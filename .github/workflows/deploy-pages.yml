name: Deploy to GitHub Pages

# npm run build가 만드는 dist/public(정적으로 평탄화된 결과물)을 GitHub Pages에
# 배포한다. src/app.js는 src/component 등을 상대경로로 import하고, index.html도
# app.js를 상대경로로 불러오는 구조라 개발 서버(server.js)처럼 src/·public/을
# 루트로 가상 매핑해주는 서버가 없으면 그대로 배포할 수 없다 — 그래서 반드시
# 빌드 후 dist/public을 배포해야 한다.
on:
  push:
    branches:
      - main
      - release/1.0.1_gis_bus_api
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
