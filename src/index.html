<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 위치 서비스</title>
    <link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        .model-label {
            position: absolute;
            left: 0;
            top: 0;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 2px 8px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            font-family: monospace;
            font-size: 12px;
            border-radius: 4px;
            white-space: nowrap;
            pointer-events: none;
            z-index: 5;
        }
        .model-label-dot {
            flex: 0 0 auto;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f44336;
        }
        #coords {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            padding: 6px 10px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            font-family: monospace;
            font-size: 13px;
            border-radius: 4px;
            pointer-events: none;
        }
        #compass {
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 10;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            pointer-events: none;
        }
        #compass .dir {
            position: absolute;
            color: #fff;
            font-family: monospace;
            font-size: 13px;
            font-weight: bold;
        }
        #compass .dir-n { top: 4px; left: 50%; transform: translateX(-50%); color: #ff5252; }
        #compass .dir-e { top: 50%; right: 4px; transform: translateY(-50%); }
        #compass .dir-s { bottom: 4px; left: 50%; transform: translateX(-50%); }
        #compass .dir-w { top: 50%; left: 4px; transform: translateY(-50%); }
        .shuttle-point-icon {
            position: relative;
            width: 22px;
            height: 22px;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            background: #ff9800;
            border: 2px solid #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
        }
        .shuttle-point-icon span {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            color: #fff;
            font-family: monospace;
            font-size: 10px;
            font-weight: bold;
        }
        #bus-panel {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            width: 300px;
            height: 600px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            font-family: monospace;
            font-size: 11px;
            border-radius: 4px;
            z-index: 10;
        }
        #bus-panel table {
            width: 100%;
            border-collapse: collapse;
        }
        #bus-panel th,
        #bus-panel td {
            padding: 4px 6px;
            text-align: left;
            white-space: nowrap;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }
        #bus-panel thead th {
            position: sticky;
            top: 0;
            background: rgba(0, 0, 0, 0.85);
        }
        #bus-panel tbody tr {
            cursor: pointer;
        }
        #bus-panel tbody tr:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        #bus-panel tbody tr.selected {
            background: rgba(33, 150, 243, 0.4);
        }
        .bus-status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f44336;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="coords">Lng: -, Lat: -</div>
    <div id="compass">
        <span class="dir dir-n">N</span>
        <span class="dir dir-e">E</span>
        <span class="dir dir-s">S</span>
        <span class="dir dir-w">W</span>
    </div>
    <div id="bus-panel">
        <table>
            <thead>
                <tr>
                    <th></th>
                    <th>버스</th>
                    <th>Lng</th>
                    <th>Lat</th>
                </tr>
            </thead>
            <tbody id="bus-panel-body"></tbody>
        </table>
    </div>

    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
